version: "3.9"
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3002:3002"   # expose nginx serving vite build

  # DR Calculation API
  backend-dr:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["uvicorn", "dr_calculation_api:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"

  # Earnings API
  backend-earnings:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["uvicorn", "earnings_api:app", "--host", "0.0.0.0", "--port", "3001"]
    ports:
      - "3001:3001"

  # News API
  backend-news:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["uvicorn", "news_api:app", "--host", "0.0.0.0", "--port", "8003"]
    ports:
      - "8003:8003"
